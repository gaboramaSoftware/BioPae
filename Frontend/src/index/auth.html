<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <div class="auth-container">
        <a class="nav-back" href="../index.html"
               onclick="window.location.href='../index.html'"
               style="border: 2px solid; border-radius: 
               5px; padding: 5px; margin: 20px; display: block;
               text-align: center; color: white;">
                <span class="icon">←</span> Volver al inicio
    </a>
        <div class="logo">
            <div class="logo-icon">
                <i>
                    <image src="../assets/Logo.png" alt="Logo" class="logo-image"
                    style="width: 60px; height: 60px; background-color: darkblue !important;"/>
                </i>
            </div>
            <h1>Autenticación</h1>
            <p>Ingrese sus credenciales para continuar</p>
        </div>

        <div id="fp-auth-bar" style="display:flex;align-items:center;gap:10px;padding:10px 14px;
             background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
             border-radius:10px;margin-bottom:16px;font-size:0.82rem;color:#94a3b8;">
            <div id="fp-auth-dot" style="width:10px;height:10px;border-radius:50%;
                 background:#22c55e;flex-shrink:0;animation:fp-pulse 1.5s infinite;"></div>
            <span id="fp-auth-status">Coloca el dedo en el sensor para acceder como admin</span>
        </div>
        <style>
            @keyframes fp-pulse {
                0%,100% { opacity:1; transform:scale(1); }
                50%      { opacity:.4; transform:scale(1.3); }
            }
        </style>

        <form class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="username">
                    <i><ion-icon name="person"></ion-icon></i>
                    Usuario
                </label>
                <input 
                    type="text" 
                    id="username" 
                    class="input-field" 
                    placeholder="rut del ADMIN sin puntos"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">
                    <i><ion-icon name="key"></ion-icon></i>
                    Contraseña
                </label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field" 
                        placeholder="••••••••"
                        required
                    >
                    <button type="button" class="password-toggle" id="togglePassword">
                        <ion-icon name="eye"></ion-icon>
                    </button>
                </div>
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        Recordarme
                    </label>
                    <a href="credenciales.html" class="forgot-link">¿Olvidó su contraseña?</a>
                </div>
            </div>

            <button type="submit" class="auth-button" id="submitBtn">
                Iniciar Sesión
            </button>
    </div>
    <script src="../js/auth.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.js"></script>
</body>
</html>
