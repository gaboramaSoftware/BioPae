name: Build Windows installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11

      - name: Build Python native extension (inplace)
        working-directory: ${{ github.workspace }}
        run: |
          python setup.py build_ext --inplace

      - name: Prepare python-embed folder for packaging
        run: |
          mkdir -p infra/python-embed || true
          # Copy any built extension (.pyd) into python-embed so electron-builder picks it up
          for f in $(ls *.pyd 2> /dev/null || true); do cp "$f" infra/python-embed/ || true; done
        shell: bash

      - name: Install frontend deps
        working-directory: Frontend/src
        run: npm ci

      - name: Build Electron installer (Windows NSIS)
        working-directory: Frontend/src
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build --if-present

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ../../dist/*.exe
            ../../dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
